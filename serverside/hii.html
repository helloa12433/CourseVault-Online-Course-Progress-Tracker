<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sudoku Solver</title>
<style>
  :root{--cell-size:48px; --gap:4px; --accent:#0b84ff;}
  body{font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:20px;background:#f6f8fa;color:#0b0b0b}
  h1{margin:0 0 12px;font-size:20px}
  .app{display:flex;gap:20px;align-items:flex-start}
  .board{display:grid;grid-template-columns:repeat(9,var(--cell-size));grid-auto-rows:var(--cell-size);gap:var(--gap);
    padding:12px;background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(10,10,10,0.08)}
  .cell{width:var(--cell-size);height:var(--cell-size);display:flex;align-items:center;justify-content:center;font-size:20px;
    border-radius:6px;border:1px solid #e6e9ee;background:transparent;outline:none;text-align:center}
  .cell:focus{box-shadow:0 0 0 3px rgba(11,132,255,0.12);border-color:var(--accent)}
  /* bold box borders */
  .board > *:nth-child(3n){border-right:2px solid #bbb}
  .board > *:nth-child(n+19):nth-child(-n+27),
  .board > *:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #bbb}
  /* conflict/highlight */
  .cell.conflict{background:rgba(255,80,80,0.16);border-color:#ff5050}
  .cell.given{font-weight:700;color:#111}
  .controls{display:flex;flex-direction:column;gap:8px}
  button{padding:8px 12px;border-radius:8px;border:1px solid #d0d4da;background:#fff;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:transparent}
  .msg{padding:8px;border-radius:8px;background:#fff;border:1px solid #e3e6ea;min-width:260px}
  .row{display:flex;gap:8px;align-items:center}
  .small{font-size:13px;color:#555}
</style>
</head>
<body>
  <h1>Sudoku Solver — input, validate, solve</h1>
  <div class="app">
    <div>
      <div class="board" id="board"></div>
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button id="validateBtn">Validate</button>
        <button id="solveBtn" class="primary">Solve</button>
        <button id="clearBtn">Clear</button>
        <button id="exampleBtn">Load Example</button>
      </div>
    </div>

    <div class="controls">
      <div class="msg" id="message">Enter digits 1–9 or leave blank. Click Validate then Solve.</div>
      <div class="row small"><strong>Status:</strong> <span id="status" style="margin-left:6px">Idle</span></div>
      <div class="row"><button id="exportBtn">Export as text</button></div>
      <div class="small">Conflict cells are highlighted in red. Given numbers are bold.</div>
    </div>
  </div>

<script>
  const boardEl = document.getElementById('board');
  const messageEl = document.getElementById('message');
  const statusEl = document.getElementById('status');

  // create 9x9 inputs
  const cells = [];
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.inputMode = 'numeric';
      inp.maxLength = 1;
      inp.className = 'cell';
      inp.dataset.r = r;
      inp.dataset.c = c;
      inp.addEventListener('input', onInput);
      inp.addEventListener('keydown', onKeyDown);
      boardEl.appendChild(inp);
      cells.push(inp);
    }
  }

  function onInput(e) {
    const v = e.target.value.replace(/[^1-9]/g, '');
    e.target.value = v;
    e.target.classList.remove('given');
    clearHighlights();
  }

  function onKeyDown(e){
    if (e.key === 'Backspace' || e.key === 'Delete') return;
    if (e.key >= '1' && e.key <= '9') return;
    // allow arrows
    const allowed = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'];
    if (allowed.includes(e.key)) return;
    e.preventDefault();
  }

  function gridFromInputs(){
    const g = Array.from({length:9}, ()=>Array(9).fill(0));
    for (const cell of cells){
      const r = +cell.dataset.r, c = +cell.dataset.c;
      const v = parseInt(cell.value) || 0;
      g[r][c] = v;
    }
    return g;
  }

  function setGrid(g, markGiven=false){
    for (let r=0;r<9;r++){
      for (let c=0;c<9;c++){
        const idx = r*9 + c;
        const val = g[r][c];
        cells[idx].value = val?String(val):'';
        cells[idx].classList.toggle('given', markGiven && val!==0);
      }
    }
  }

  function clearHighlights(){
    cells.forEach(x=>x.classList.remove('conflict'));
  }

  function showMessage(txt){
    messageEl.textContent = txt;
  }

  // validation function: checks duplicates in rows/cols/boxes and highlights conflicts
  function validateGrid(grid){
    clearHighlights();
    let valid = true;
    const mark = (r,c)=> cells[r*9 + c].classList.add('conflict');

    // rows
    for (let r=0;r<9;r++){
      const seen = new Map();
      for (let c=0;c<9;c++){
        const v = grid[r][c];
        if (!v) continue;
        if (seen.has(v)){
          valid = false;
          mark(r,c);
          const prevC = seen.get(v);
          mark(r,prevC);
        } else seen.set(v,c);
      }
    }
    // cols
    for (let c=0;c<9;c++){
      const seen = new Map();
      for (let r=0;r<9;r++){
        const v = grid[r][c];
        if (!v) continue;
        if (seen.has(v)){
          valid = false;
          mark(r,c);
          const prevR = seen.get(v);
          mark(prevR,c);
        } else seen.set(v,r);
      }
    }
    // boxes
    for (let br=0;br<3;br++){
      for (let bc=0;bc<3;bc++){
        const seen = new Map();
        for (let rr=0;rr<3;rr++){
          for (let cc=0;cc<3;cc++){
            const r = br*3 + rr, c = bc*3 + cc;
            const v = grid[r][c];
            if (!v) continue;
            if (seen.has(v)){
              valid = false;
              mark(r,c);
              const [pr,pc] = seen.get(v);
              mark(pr,pc);
            } else seen.set(v,[r,c]);
          }
        }
      }
    }
    return valid;
  }

  // Backtracking solver with row/col/box sets for speed
  function solveSudoku(grid){
    // clones
    const g = grid.map(row => row.slice());
    const rows = Array.from({length:9}, ()=>new Set());
    const cols = Array.from({length:9}, ()=>new Set());
    const boxes = Array.from({length:9}, ()=>new Set());
    const empties = [];
    for (let r=0;r<9;r++){
      for (let c=0;c<9;c++){
        const v = g[r][c];
        if (v){
          rows[r].add(v);
          cols[c].add(v);
          boxes[Math.floor(r/3)*3 + Math.floor(c/3)].add(v);
        } else empties.push([r,c]);
      }
    }

    // heuristic: sort empties by number of candidates (MRV)
    function candidates(r,c){
      const b = Math.floor(r/3)*3 + Math.floor(c/3);
      const res = [];
      for (let v=1; v<=9; v++){
        if (!rows[r].has(v) && !cols[c].has(v) && !boxes[b].has(v)) res.push(v);
      }
      return res;
    }

    empties.sort((a,b)=>{
      const ca = candidates(a[0],a[1]).length;
      const cb = candidates(b[0],b[1]).length;
      return ca - cb;
    });

    let solved = false;

    function dfs(idx){
      if (idx === empties.length){ solved = true; return true; }
      const [r,c] = empties[idx];
      const b = Math.floor(r/3)*3 + Math.floor(c/3);
      for (let v=1; v<=9; v++){
        if (rows[r].has(v) || cols[c].has(v) || boxes[b].has(v)) continue;
        rows[r].add(v); cols[c].add(v); boxes[b].add(v);
        g[r][c] = v;
        // recursive
        if (dfs(idx+1)) return true;
        rows[r].delete(v); cols[c].delete(v); boxes[b].delete(v);
        g[r][c] = 0;
      }
      return false;
    }

    // quick check: if any cell has zero candidates initially -> unsolvable
    for (const [r,c] of empties){
      if (candidates(r,c).length === 0) return null;
    }

    if (dfs(0)) return g;
    return null;
  }

  // buttons
  document.getElementById('validateBtn').addEventListener('click', ()=>{
    const g = gridFromInputs();
    const ok = validateGrid(g);
    if (ok){
      showMessage('Grid is valid (no duplicates found).');
      statusEl.textContent = 'Valid';
    } else {
      showMessage('Grid has conflicts — red cells show duplicates.');
      statusEl.textContent = 'Invalid';
    }
  });

  document.getElementById('solveBtn').addEventListener('click', ()=>{
    const g = gridFromInputs();
    const ok = validateGrid(g);
    if (!ok){
      showMessage('Grid has conflicts — fix them before solving.');
      statusEl.textContent = 'Invalid';
      return;
    }
    showMessage('Trying to solve...');
    statusEl.textContent = 'Solving';
    // allow small delay for UI update
    setTimeout(()=>{
      const solved = solveSudoku(g);
      if (solved){
        setGrid(solved,false);
        showMessage('Solved! Filled grid.');
        statusEl.textContent = 'Solved';
      } else {
        showMessage('No solution exists for this grid.');
        statusEl.textContent = 'Unsolvable';
      }
    }, 50);
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    setGrid(Array.from({length:9},()=>Array(9).fill(0)),false);
    clearHighlights();
    showMessage('Cleared.');
    statusEl.textContent = 'Idle';
  });

  document.getElementById('exampleBtn').addEventListener('click', ()=>{
    const example = [
      [5,3,0,0,7,0,0,0,0],
      [6,0,0,1,9,5,0,0,0],
      [0,9,8,0,0,0,0,6,0],
      [8,0,0,0,6,0,0,0,3],
      [4,0,0,8,0,3,0,0,1],
      [7,0,0,0,2,0,0,0,6],
      [0,6,0,0,0,0,2,8,0],
      [0,0,0,4,1,9,0,0,5],
      [0,0,0,0,8,0,0,7,9]
    ];
    setGrid(example,true);
    clearHighlights();
    showMessage('Loaded example puzzle. Click Solve.');
    statusEl.textContent = 'Example loaded';
  });

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    const g = gridFromInputs();
    let t = '';
    for (let r=0;r<9;r++){
      for (let c=0;c<9;c++) t += (g[r][c] || '.') ;
      t += '\n';
    }
    navigator.clipboard?.writeText(t).then(()=> showMessage('Export copied to clipboard'), ()=> showMessage('Copy failed, here is result:\n'+t));
  });

  // initialize with example
  document.getElementById('exampleBtn').click();
</script>
</body>
</html>
